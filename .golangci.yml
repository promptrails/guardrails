version: "2"
linters:
  enable:
    - gocritic
    - misspell
    - revive
    - unconvert
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/promptrails/guardrails
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
